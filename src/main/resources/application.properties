spring.application.name=res-api-many-to-many-example

# ===================================================================
# CONFIGURACION DEL SERVIDOR (Tomcat 11 / Jakarta EE 11)
# ===================================================================
server.port=8080
server.compression.enabled=true
#server.servlet.context-path=/api/v1

# Estrategia de cabeceras proxy nativa (Sustituye por completo al obsoleto use-forward-headers)
server.forward-headers-strategy=native
app.security.secret=my-secret-key-my-secret-key-my-secret-key-12345678901234567890

# ===================================================================
# RENDIMIENTO MAXIMO (Java 25 Virtual Threads)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# POOL DE DATOS STANDARD: BASE DE DATOS PRINCIPAL (MySQL 8.4 LTS)
# ===================================================================
spring.datasource.url=jdbc:mysql://192.168.122.43:3306/many_to_many?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Kose9suf
#spring.datasource.username=${DB_MYSQL_USERNAME}
#spring.datasource.password=${DB_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del Pool de Hikari estándar
spring.datasource.hikari.maximum-pool-size=30

# ===================================================================
# CONFIGURACION GLOBAL DE HIBERNATE / JPA
# ===================================================================
#create, create-drop, validate, update, none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Obliga a Spring Boot a buscar y ejecutar scripts SQL (como data.sql)
#spring.sql.init.mode=always
# ¡LA CLAVE! Espera a que Hibernate cree las tablas antes de ejecutar data.sql
#spring.jpa.defer-datasource-initialization=true
